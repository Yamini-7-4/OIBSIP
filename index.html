<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperature Converter</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.container{
    background:#fff;
    width:400px;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    text-align:center;
}

h1{
    color:#333;
    margin-bottom:20px;
}

.input-box{
    margin-bottom:15px;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:2px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#667eea;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#4f63d8;
}

.result{
    margin-top:20px;
    padding:15px;
    background:#f4f4f4;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
    color:#333;
}

.footer{
    margin-top:15px;
    color:#777;
    font-size:14px;
}
</style>
</head>
<body>

<div class="container">
    <h1>🌡 Temperature Converter</h1>

    <div class="input-box">
        <input type="text" id="temperature" placeholder="Enter Temperature">
    </div>

    <div class="input-box">
        <select id="fromUnit">
            <option value="C">Celsius (°C)</option>
            <option value="F">Fahrenheit (°F)</option>
            <option value="K">Kelvin (K)</option>
        </select>
    </div>

    <div class="input-box">
        <select id="toUnit">
            <option value="F">Fahrenheit (°F)</option>
            <option value="C">Celsius (°C)</option>
            <option value="K">Kelvin (K)</option>
        </select>
    </div>

    <button onclick="convertTemp()">Convert</button>

    <div class="result" id="result">
        Converted temperature will appear here
    </div>

    <div class="footer">
        Built with HTML, CSS & JavaScript
    </div>
</div>

<script>
function convertTemp() {

    let temp = document.getElementById("temperature").value;
    let from = document.getElementById("fromUnit").value;
    let to = document.getElementById("toUnit").value;
    let resultBox = document.getElementById("result");

    if(temp === "" || isNaN(temp)){
        resultBox.innerHTML = "⚠ Please enter a valid number!";
        return;
    }

    temp = parseFloat(temp);
    let result;

    if(from === to){
        result = temp;
    }

    // Celsius conversions
    else if(from === "C" && to === "F"){
        result = (temp * 9/5) + 32;
    }
    else if(from === "C" && to === "K"){
        result = temp + 273.15;
    }

    // Fahrenheit conversions
    else if(from === "F" && to === "C"){
        result = (temp - 32) * 5/9;
    }
    else if(from === "F" && to === "K"){
        result = (temp - 32) * 5/9 + 273.15;
    }

    // Kelvin conversions
    else if(from === "K" && to === "C"){
        result = temp - 273.15;
    }
    else if(from === "K" && to === "F"){
        result = (temp - 273.15) * 9/5 + 32;
    }

    resultBox.innerHTML =
        `${temp} °${from} = <br><br> ${result.toFixed(2)} °${to}`;
}
</script>

</body>
</html>
